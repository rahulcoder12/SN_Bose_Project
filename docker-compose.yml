version: '3.8'

services:
  api:
    build: ./ingestion-api
    ports:
      - "8000:8000"
    env_file:
      - ./ingestion-api/.env
    volumes:
      - model_data:/app/models
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  model_data:
