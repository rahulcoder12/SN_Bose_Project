<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Zero Trust - Security Dashboard</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto; background: #0f172a; color: white; padding: 40px; }
        .container { max-width: 900px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 20px; margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
        .panel { background: #1e293b; padding: 25px; border-radius: 12px; }
        .stat-box { font-size: 32px; color: #10b981; font-weight: bold; font-family: monospace; }
        .warning { color: #f59e0b; }
        .btn-danger { background: #ef4444; color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; cursor: pointer; font-weight: bold; margin-top: 15px;}
        .password-reveal { background: #0f172a; padding: 15px; text-align: center; font-family: monospace; font-size: 20px; letter-spacing: 2px; color: #38bdf8; margin-top: 15px; border: 1px dashed #475569; display: none;}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 style="margin:0; color: #38bdf8;">Security Dashboard</h1>
            <div>Logged in as: <span id="display-user" style="font-weight:bold;"></span></div>
        </div>

        <div class="grid">
            <div class="panel">
                <h2>Active Session Telemetry</h2>
                <p>Status: <span style="color:#10b981;">● Active & Authenticated</span></p>
                <div style="background: #0f172a; height: 200px; border-radius: 8px; position: relative;">
                    <canvas id="behaviorChart"></canvas>
                </div>
            </div>

            <div class="panel">
                <h2>Credential Lifecycle</h2>
                <p>Password expires in:</p>
                <div class="stat-box" id="days-left">-- Days</div>
                
                <hr style="border: 0; border-top: 1px solid #334155; margin: 20px 0;">
                
                <p style="font-size: 14px; color: #94a3b8;">If you believe your step-up password is compromised, rotate it immediately.</p>
                <button class="btn-danger" id="regen-btn">Regenerate Password</button>
                <div class="password-reveal" id="new-pwd-display"></div>
            </div>
        </div>
    </div>

    <script>
        // Ensure user is logged in (check for JWT token)
        const activeUser = sessionStorage.getItem("activeUser");
        const accessToken = sessionStorage.getItem("accessToken");
        
        if (!activeUser || !accessToken) {
            window.location.href = "/login.html";
        }

        document.getElementById('display-user').innerText = activeUser;
        
        const daysLeft = parseInt(sessionStorage.getItem("daysLeft"));
        const daysEl = document.getElementById('days-left');
        daysEl.innerText = daysLeft + " Days";
        if (daysLeft < 15) daysEl.classList.add('warning');

        if (daysLeft < 10) {
            daysEl.classList.add('warning');
        }

        // --- Live Behavior Graph Implementation ---
        const ctx = document.getElementById('behaviorChart').getContext('2d');
        const chartData = {
            labels: Array(20).fill(''), // 20 data points of history
            datasets: [{
                label: 'AI Risk Score (Anomaly Detection)',
                data: Array(20).fill(1.0), // Start with neutral 1.0
                borderColor: '#10b981', // green default
                backgroundColor: 'rgba(16, 185, 129, 0.1)',
                borderWidth: 2,
                fill: true,
                tension: 0.4,
                pointRadius: 0
            }]
        };

        const behaviorChart = new Chart(ctx, {
            type: 'line',
            data: chartData,
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: { 
                        min: -1.0, max: 1.0, 
                        grid: { color: '#334155' },
                        ticks: { color: '#94a3b8' }
                    },
                    x: { 
                        grid: { display: false },
                        ticks: { display: false }
                    }
                },
                plugins: {
                    legend: { labels: { color: '#cbd5e1' } }
                },
                animation: { duration: 500 }
            }
        });

        async function pollTelemetry() {
            try {
                const response = await fetch('/api/v1/admin/sessions', {
                    headers: { 'Authorization': 'Bearer ' + accessToken }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    const sessions = data.active_sessions;
                    const sessionIds = Object.keys(sessions);
                    
                    let latestScore = 1.0; // Default if idle

                    if (sessionIds.length > 0) {
                        // Plot the most recently updated session
                        let mostRecent = sessions[sessionIds[0]];
                        for (let id of sessionIds) {
                            if (sessions[id].last_seen > mostRecent.last_seen) {
                                mostRecent = sessions[id];
                            }
                        }
                        latestScore = mostRecent.risk_score;
                    }

                    // Shift data array and append new score
                    chartData.datasets[0].data.shift();
                    chartData.datasets[0].data.push(latestScore);

                    // Change color to red if anomalous
                    if (latestScore < 0) {
                        chartData.datasets[0].borderColor = '#ef4444';
                        chartData.datasets[0].backgroundColor = 'rgba(239, 68, 68, 0.1)';
                    } else {
                        chartData.datasets[0].borderColor = '#10b981';
                        chartData.datasets[0].backgroundColor = 'rgba(16, 185, 129, 0.1)';
                    }

                    behaviorChart.update();
                }
            } catch (error) {
                console.error("Telemetry polling failed:", error);
            }
        }

        // Poll every 2 seconds
        setInterval(pollTelemetry, 2000);
        pollTelemetry();
        // -------------------------------------------

        // Regenerate Logic — uses JWT Bearer token instead of raw password
        document.getElementById('regen-btn').addEventListener('click', async () => {
            const btn = document.getElementById('regen-btn');
            btn.innerText = "Rotating...";

            const token = sessionStorage.getItem("accessToken");

            try {
                const res = await fetch('/api/v1/auth/regenerate', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    }
                });

                if (res.ok) {
                    const data = await res.json();
                    
                    sessionStorage.setItem("daysLeft", data.days_until_expiry);
                    
                    daysEl.innerText = data.days_until_expiry + " Days";
                    daysEl.classList.remove('warning');

                    // Show new password on the screen
                    const revealBox = document.getElementById('new-pwd-display');
                    revealBox.innerText = data.new_password;
                    revealBox.style.display = "block";
                    btn.innerText = "Regenerate Password";
                } else if (res.status === 401) {
                    // Token expired — redirect to login
                    sessionStorage.clear();
                    window.location.href = "/login.html";
                } else {
                    const errorData = await res.json();
                    alert("⚠️ Server Error: " + errorData.detail);
                    btn.innerText = "Regenerate Password";
                }
            } catch (err) {
                alert("⚠️ Network Error: Could not connect to the backend.");
                btn.innerText = "Regenerate Password";
            }
        });
    </script>
</body>
</html>
