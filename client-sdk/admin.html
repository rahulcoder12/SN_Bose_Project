<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Zero Trust Auth - Admin Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background-color: #121212; color: #e0e0e0; margin: 0; padding: 20px; }
        h1 { border-bottom: 1px solid #333; padding-bottom: 10px; }
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; margin-top: 20px; }
        .session-card { background: #1e1e1e; border: 1px solid #333; border-radius: 8px; padding: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .authentic { border-top: 4px solid #00C851; }
        .anomaly { border-top: 4px solid #ff4444; background: #2a1111; }
        .metric { display: flex; justify-content: space-between; margin: 8px 0; font-size: 14px; }
        .metric-label { color: #888; }
        .badge { padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 12px; }
        .badge-safe { background: #00C851; color: #000; }
        .badge-danger { background: #ff4444; color: #fff; }
        .chart-container { margin-top: 15px; height: 120px; width: 100%; }
    </style>
</head>
<body>
    <h1>🛡️ Live Threat Monitoring</h1>
    <p>Real-time continuous biometric evaluation across all active sessions.</p>
    
    <div class="dashboard-grid" id="sessions-container">
        <p style="color: #888;">Waiting for active sessions...</p>
    </div>

    <script>
        // Store existing charts so we can update them without flickering
        const activeCharts = {};

        async function fetchSessions() {
            try {
                const response = await fetch('http://localhost:8000/api/v1/admin/sessions');
                const data = await response.json();
                renderDashboard(data.active_sessions);
            } catch (error) {
                console.error("Failed to fetch dashboard data", error);
            }
        }

        function renderDashboard(sessions) {
            const container = document.getElementById('sessions-container');
            const sessionKeys = Object.keys(sessions);
            
            if (sessionKeys.length === 0) {
                container.innerHTML = '<p style="color: #888;">No active sessions detected.</p>';
                return;
            }

            // Clear the "Waiting" text on first load
            if (container.innerHTML.includes("Waiting for active sessions")) {
                container.innerHTML = '';
            }

            sessionKeys.forEach(id => {
                const s = sessions[id];
                const isAnomaly = s.latest_verdict === "ANOMALY";
                const shortId = id.substring(0, 12) + "..."; 

                // 1. Create or update the HTML Card
                let card = document.getElementById(`card-${id}`);
                if (!card) {
                    card = document.createElement('div');
                    card.id = `card-${id}`;
                    container.appendChild(card);
                }
                
                card.className = `session-card ${isAnomaly ? 'anomaly' : 'authentic'}`;
                card.innerHTML = `
                    <div class="metric">
                        <strong>Session: ${shortId}</strong>
                        <span class="badge ${isAnomaly ? 'badge-danger' : 'badge-safe'}">${s.latest_verdict || 'ANALYZING'}</span>
                    </div>
                    <hr style="border: 0; border-top: 1px solid #333; margin: 10px 0;">
                    <div class="metric"><span class="metric-label">Risk Score:</span> <strong>${s.risk_score !== undefined ? s.risk_score : 'N/A'}</strong></div>
                    <div class="metric"><span class="metric-label">Keystrokes:</span> <span>${s.total_keystrokes}</span></div>
                    <div class="metric"><span class="metric-label">Error Rate:</span> <span>${s.total_keystrokes > 0 ? (s.total_corrections / s.total_keystrokes * 100).toFixed(1) : 0}%</span></div>
                    <div class="chart-container">
                        <canvas id="chart-${id}"></canvas>
                    </div>
                `;

                // 2. Draw or Update the Chart.js Graph
                if (s.risk_history && s.risk_history.length > 0) {
                    const ctx = document.getElementById(`chart-${id}`).getContext('2d');
                    const labels = s.risk_history.map((_, index) => `${index + 1}`);

                    if (activeCharts[id]) {
                        // Update existing chart smoothly
                        activeCharts[id].data.labels = labels;
                        activeCharts[id].data.datasets[0].data = s.risk_history;
                        activeCharts[id].data.datasets[0].borderColor = isAnomaly ? '#ff4444' : '#00C851';
                        activeCharts[id].data.datasets[0].backgroundColor = isAnomaly ? 'rgba(255, 68, 68, 0.1)' : 'rgba(0, 200, 81, 0.1)';
                        activeCharts[id].update();
                    } else {
                        // Create a new chart
                        activeCharts[id] = new Chart(ctx, {
                            type: 'line',
                            data: {
                                labels: labels,
                                datasets: [{
                                    label: 'Risk Score',
                                    data: s.risk_history,
                                    borderColor: isAnomaly ? '#ff4444' : '#00C851',
                                    backgroundColor: isAnomaly ? 'rgba(255, 68, 68, 0.1)' : 'rgba(0, 200, 81, 0.1)',
                                    borderWidth: 2,
                                    fill: true,
                                    tension: 0.3
                                }]
                            },
                            options: {
                                responsive: true,
                                maintainAspectRatio: false,
                                animation: { duration: 0 }, // Prevent UI flicker on poll
                                plugins: { legend: { display: false } },
                                scales: { x: { display: false }, y: { grid: { color: '#333' }, ticks: { color: '#888' } } }
                            }
                        });
                    }
                }
            });
        }

        // Poll the API every 2 seconds
        setInterval(fetchSessions, 2000);
        fetchSessions(); 
    </script>
</body>
</html>
